<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>niKo صوت طبيعي</title>
<style>body{margin:0;background:#;font-family:Tahoma}.wrap{max-width:560px;margin:auto;padding:10px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 10px #0002}.chat{height:320px;overflow:auto;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:8px;text-align:right}.msg{padding:10px;border-radius:12px;margin:6px 0;max-width:85%;line-height:1.6}.ai{background:#;color:#fff;float:right;clear:both}.user{background:#;color:#000;float:left;clear:both}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;margin:5px 0;cursor:pointer}.input{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;text-align:right;box-sizing:border-box}select{width:100%;padding:10px;border-radius:10px;margin:5px 0}</style>
</head><body><div class="wrap"><div class="card">
<h3 style="margin:0 0 8px">🤖 niKo - صوت طبيعي</h3>

<div style="background:#;border-radius:10px;padding:8px;margin-bottom:8px;text-align:right;font-size:12px">
🎙️ اختار الصوت اللي يعجبك:
<select id="voiceSelect"></select>
<div style="display:flex;gap:6px;margin-top:6px">
<label style="flex:1">السرعة: <input id="rate" type="range" min="0.6" max="1.2" step="0.1" value="0.85" style="width:100%"></label>
<label style="flex:1">النبرة: <input id="pitch" type="range" min="0.7" max="1.3" step="0.1" value="0.9" style="width:100%"></label>
</div>
</div>

<div id="chat" class="chat"></div>
<input id="t" class="input" placeholder="اكتب: عندي ألم في صدري..." onkeydown="if(event.key==='Enter')go()">
<div style="display:flex;gap:6px">
<button class="btn" style="background:#111;color:#fff;flex:1" onclick="go()">إرسال ➤</button>
<button class="btn" style="background:#;color:#fff;flex:1" onclick="talkLast()">🔊 أعد بصوت جديد</button>
</div>
<button class="btn" style="background:#;color:#000" onclick="startTalk()">🎤 اضغط وتكلم</button>
<button class="btn" style="background:#;color:#fff" onclick="location.href='tel:937'">📞 937 مجاناً</button>
</div></div>

<script>
let chat=document.getElementById('chat'), voices=[], lastText="";
function loadVoices(){
 voices=speechSynthesis.getVoices();
 let sel=document.getElementById('voiceSelect'); sel.innerHTML="";
 let arabic=voices.filter(v=>v.lang.includes('ar'));
 let list=arabic.length?arabic:voices;
 list.forEach((v,i)=>{
 let o=document.createElement('option');
 o.value=voices.indexOf(v);
 o.text=(v.name.includes('Google')?'⭐ ':'')+v.name+' - '+v.lang+(v.name.toLowerCase().includes('male')||v.name.includes('ذكر')?' ♂️':' ♀️');
 sel.appendChild(o);
 });
 // اختار أفضل صوت رجالي عربي تلقائياً
 let best=voices.findIndex(v=>v.lang.includes('ar-SA')&&v.name.toLowerCase().includes('male'));
 if(best==-1) best=voices.findIndex(v=>v.lang.includes('ar')&&v.name.includes('Google'));
 if(best==-1) best=voices.findIndex(v=>v.lang.includes('ar'));
 if(best>=0) sel.value=best;
}
speechSynthesis.onvoiceschanged=loadVoices;
setTimeout(loadVoices,500);

function add(m,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=m;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function speak(text){
 lastText=text;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(text);
 let idx=document.getElementById('voiceSelect').value;
 if(voices[idx]){u.voice=voices[idx]; u.lang=voices[idx].lang;}
 else{u.lang='ar-SA';}
 u.rate=parseFloat(document.getElementById('rate').value);
 u.pitch=parseFloat(document.getElementById('pitch').value);
 u.volume=1;
 speechSynthesis.speak(u);
}
function talkLast(){if(lastText)speak(lastText)}
function go(){
 let v=document.getElementById('t').value.trim(); if(!v)return;
 add(v,'user'); document.getElementById('t').value='';
 let r='';
 let low=v.toLowerCase();
 if(low.includes('صدر')||low.includes('صدري')||low.includes('قلب')){
 r='سلامتك يا طيب، ألم الصدر اللي ينتقل للظهر هذا لازم نهتم فيه.\n\nاجلس وارتاح الحين، لا تجهد نفسك، واتصل على 937 المجاني، بيحولونك لأقرب دكتور قلب في جدة، مستشفى الملك فهد رقمه 012-6606111\n\nإذا معه ضيق نفس أو تعرق اتصل 997 فوراً.';
 }else if(low.includes('جدة')){r='جدة ونعم والله، أهل الكرم! قل لي وش تحس فيه بالضبط؟';}
 else{r='سمعتك: '+v+'\nقل لي أكثر، وين الألم ومتى بدأ؟';}
 add(r,'ai'); speak(r);
}
function startTalk(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('افتح Chrome');return}
 let rec=new SR(); rec.lang='ar-SA'; rec.start();
 rec.onresult=e=>{let txt=e.results[0][0].transcript; document.getElementById('t').value=txt; go();}
}
add('السلام عليكم! أنا niKo بصوتي الجديد، كيف حالك اليوم؟','ai');
</script></body></html>
