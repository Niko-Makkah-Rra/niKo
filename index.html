
<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>niKo النهائي 🌍</title><style>body{margin:0;background:#;font-family:Tahoma}.wrap{max-width:560px;margin:auto;padding:8px}.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.13)}.btn{width:100%;padding:13px;border:none;border-radius:14px;font-weight:900;font-size:13px;margin:5px 0;cursor:pointer}.voice{background:#111;color:#fff;padding:22px;border-radius:50px;font-size:20px;animation:pulse 1.2s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}.input{width:100%;border:1.5px solid #bbb;border-radius:12px;padding:12px;margin:5px 0;text-align:right;box-sizing:border-box}select{width:100%;padding:12px;border:2px solid #111;border-radius:12px;font-weight:900;margin:6px 0;background:#fff}.chat{max-height:320px;overflow-y:auto;text-align:right;padding:6px;background:#fafafa;border-radius:12px;border:1px solid #eee}.msg{padding:10px 12px;border-radius:14px;margin:6px 0;font-size:13px;max-width:85%}.ai{background:#;color:#fff;float:right;clear:both}.user{background:#;color:#000;float:left;clear:both}.clear{clear:both}.result{border:2px solid #;background:#;border-radius:12px;padding:10px;margin:6px 0;text-align:right;font-size:12px}.emer-result{border:2px solid #;background:#ffebee}.call{background:#;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:900;margin:3px}.call-green{background:#198754}.call-blue{background:#}</style></head><body><div class="wrap"><div class="card" style="border:3px solid #111"><div style="font-size:20px;font-weight:900">🤖 niKo 🌍 النهائي - يتكلم كل اللغات</div><select id="langSelect" onchange="setLang()"><option value="ar-SA" selected>🇸🇦 عربي</option><option value="tr-TR">🇹🇷 Türkçe</option><option value="en-US">🇺🇸 English</option><option value="fr-FR">🇫🇷 Français</option><option value="de-DE">🇩🇪 Deutsch</option><option value="es-ES">🇪🇸 Español</option><option value="zh-CN">🇨🇳 中文</option><option value="hi-IN">🇮🇳 हिन्दी</option><option value="ur-PK">🇵🇰 اردو</option><option value="id-ID">🇮🇩 Indonesia</option><option value="fa-IR">🇮🇷 فارسی</option><option value="auto">🌍 AUTO</option></select><div id="chat" class="chat"></div><div class="clear"></div><button id="talkBtn" class="btn voice" onclick="startTalk()">🎤 اضغط وتكلم</button><button class="btn" style="background:#;color:#fff" onclick="startConversation()">▶️ ابدأ الحوار</button><div style="display:flex;gap:6px"><button class="btn" style="background:#111;color:#fff;flex:1" onclick="reSpeak()">🔊 أعد</button><button class="btn" style="background:#;color:#fff;flex:1" onclick="speechSynthesis.cancel()">🔇 اسكت</button></div></div><div class="card" style="border:3px solid #"><div style="font-weight:900;text-align:right">📞 937 المجاني - السعودية</div><button class="btn" style="background:#;color:#fff;font-size:18px;padding:16px" onclick="location.href='tel:937'">📞 اتصل 937 مجاناً - يحولك لأقرب دكتور في قريتك</button></div><div class="card" style="border:3px solid #"><div style="font-weight:900;text-align:right">🏥 بحث المستشفيات</div><input id="hospSearch" class="input" placeholder="اكتب: النور، فيصل، فقيه، الحبيب..." oninput="searchHospByName()"><button class="btn" style="background:#;color:#fff" onclick="searchHospByName()">🔍 ابحث مستشفى</button><div id="hospResult"></div><button class="btn" style="background:#;color:#fff" onclick="searchHospMap()">🗺️ أقرب مستشفى - خريطة</button></div><div class="card" style="border:3px solid #"><div style="font-weight:900;text-align:right">🚨 بحث وأزرار الإسعاف - العالم كله</div><input id="emerSearch" class="input" placeholder="اكتب: السعودية، الكويت، تركيا..." oninput="searchEmerByName()"><button class="btn" style="background:#;color:#fff" onclick="searchEmerByName()">🔍 ابحث إسعاف</button><div id="emerResult"></div><div style="display:flex;flex-wrap:wrap;gap:4px"><button class="btn" style="background:#;color:#fff;width:48%" onclick="location.href='tel:997'">🇸🇦 997</button><button class="btn" style="background:#;color:#fff;width:48%" onclick="location.href='tel:112'">🇰🇼 112</button><button class="btn" style="background:#;color:#fff;width:48%" onclick="location.href='tel:112'">🇹🇷 112</button><button class="btn" style="background:#;color:#fff;width:48%" onclick="location.href='tel:123'">🇪🇬 123</button><button class="btn" style="background:#;color:#000;width:100%" onclick="location.href='tel:112'">🌍 112 عالمي</button></div></div></div><script>let currentLang="ar-SA",lastAi="",step=0,patientData={from:"",city:""};const hospitals=[{name:"النور مكة",number:"012-5665000",city:"مكة",spec:"عام"},{name:"الملك فيصل",number:"011-4647272",city:"الرياض - كل المناطق",spec:"قلب - كل التخصصات"},{name:"الملك فهد جدة",number:"012-6606111",city:"جدة",spec:"عام"},{name:"سليمان فقيه",number:"012-6655000",city:"جدة",spec:"خاص ممتاز"},{name:"د.الحبيب",number:"011-5259999",city:"كل المناطق",spec:"ممتاز"},{name:"أجيبادم تركيا",number:"444-5444",city:"تركيا",spec:"ممتاز"}];const emers=[{country:"السعودية",region:"كل المناطق - مكة، الرياض، جدة...",number:"997 / 911 / 937",call:"997"},{country:"الكويت",region:"كل المناطق",number:"112",call:"112"},{country:"تركيا",region:"81 ولاية",number:"112",call:"112"},{country:"مصر",region:"27 محافظة",number:"123",call:"123"},{country:"عالمي",region:"200 دولة",number:"112",call:"112"}];function setLang(){let s=document.getElementById('langSelect').value;if(s==="auto")currentLang=navigator.language||"ar-SA";else currentLang=s;startConversation()}function addMsg(t,w){let c=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+w;d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight;let cl=document.createElement('div');cl.className='clear';c.appendChild(cl)}function speak(t){lastAi=t;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=currentLang;u.rate=0.9;speechSynthesis.speak(u)}function reSpeak(){if(lastAi)speak(lastAi)}function startConversation(){step=1;document.getElementById('chat').innerHTML="";let g=currentLang.startsWith('tr')?"Merhaba! Nasılsın bugün?":currentLang.startsWith('en')?"Hello! How are you today?":"السلام عليكم كيف حالك اليوم؟";addMsg(g,'ai');speak(g)}function startTalk(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("افتح Chrome");return}let rec=new SR();rec.lang=currentLang;rec.start();document.getElementById('talkBtn').innerHTML="👂 اسمعك...";rec.onresult=e=>{let txt=e.results[0][0].transcript;addMsg(txt,'user');handle(txt)};rec.onend=()=>{document.getElementById('talkBtn').innerHTML="🎤 اضغط وتكلم"}}function handle(txt){if(step===1){step=2;let q=currentLang.startsWith('tr')?"Nerelisin? Hangi şehir köy?":"انت من أين؟ من أي مدينة وقرية؟";addMsg(q,'ai');speak(q)}else if(step===2){patientData.from=txt;patientData.city=txt.split(' ')[0];step=3;let q=currentLang.startsWith('tr')?`${txt} güzel! Ne hissediyorsun?`:`${txt} ونعم! وش تحس اليوم؟`;addMsg(q,'ai');speak(q)}else if(step===3){let spec=txt.includes('بطن')||txt.includes('mide')?"باطنة ممتاز":txt.includes('قلب')||txt.includes('kalp')?"قلب ممتاز":"عام ممتاز";let f=currentLang.startsWith('tr')?`Anladım ${txt}. En iyi ${spec} doktoru ${patientData.from} bölgesinde. En yakın hastane ${patientData.city}. 112 ara.`:`فهمت تقول ${txt}. سلامتك! أفضل ${spec} موجود في نفس منطقتك ${patientData.from}. لازم تروح لأقرب مستشفى في ${patientData.city}. اتصل 997 أو 937 مجاني.`;addMsg(f,'ai');speak(f);step=1}}function searchHospByName(){let q=document.getElementById('hospSearch').value.trim();let r=document.getElementById('hospResult');if(!q){r.innerHTML="";return}let f=hospitals.filter(h=>h.name.includes(q)||h.city.includes(q));if(!f.length){r.innerHTML=`<div class="result">ما لقيت "${q}"</div>`;return}r.innerHTML=f.map(h=>`<div class="result"><b>🏥 ${h.name}</b><br>📍 ${h.city}<br>📞 ${h.number}<br><button class="call call-green" onclick="location.href='tel:${h.number}'">📞 اتصل</button> <button class="call call-blue" onclick="window.open('https://www.google.com/maps/search/${encodeURIComponent(h.name)}','_blank')">🗺️ خريطة</button></div>`).join('');speak(`لقيت ${f[0].name} رقمه ${f[0].number}`)}function searchEmerByName(){let q=document.getElementById('emerSearch').value.trim();let r=document.getElementById('emerResult');if(!q){r.innerHTML="";return}let f=emers.filter(e=>e.country.includes(q));if(!f.length){r.innerHTML=`<div class="result emer-result">ما لقيت</div>`;return}r.innerHTML=f.map(e=>`<div class="result emer-result"><b>🚨 ${e.country}</b><br>📍 ${e.region}<br>📞 ${e.number}<br><button class="call" onclick="location.href='tel:${e.call}'">🚨 اتصل ${e.call}</button></div>`).join('');speak(`إسعاف ${f[0].country} رقمه ${f[0].number}`)}function searchHospMap(){let c=patientData.city||"مكة";let v=patientData.from||"";window.open("https://www.google.com/maps/search/مستشفى+في+"+encodeURIComponent(v+" "+c),"_blank")}window.onload=()=>{setTimeout(startConversation,800)}</script></body></html>
